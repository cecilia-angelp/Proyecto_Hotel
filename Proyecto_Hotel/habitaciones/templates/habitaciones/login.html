{% extends 'habitaciones/base.html' %}

{% block content %}
<style>
    .login-caja {
        max-width: 400px; 
        margin: 80px auto; 
        padding: 40px; 
        background-color: #161616; 
        border: 1px solid #a68242; 
        color: #f4f1ea; 
        font-family: serif; 
        box-shadow: 0 15px 25px rgba(0,0,0,0.8);
        border-radius: 4px;
    }
    .login-input {
        width: 100%;
        padding: 12px; /* Más espacio interior */
        margin-top: 5px;
        background-color: #222;
        border: 1px solid #444;
        color: #f4f1ea;
        font-size: 18px; /* LETRA MÁS GRANDE */
        font-family: serif; /* MISMA TIPOGRAFÍA DEL HOTEL */
        box-sizing: border-box;
    }
    .login-btn {
        background-color: #a68242; 
        color: #111; 
        padding: 14px 20px; 
        border: none; 
        cursor: pointer; 
        font-weight: bold; 
        width: 100%; 
        letter-spacing: 2px;
        transition: 0.3s;
        border-radius: 2px;
    }
    .login-btn:hover {
        background-color: #c49a4e;
    }
</style>

<div class="login-caja">
    <h2 style="color: #a68242; text-align: center; letter-spacing: 2px; margin-bottom: 25px;">ACCESO DE PERSONAL</h2>
    
    {% if form.errors %}
        <p style="color: #d9534f; font-size: 14px; text-align: center; margin-bottom: 20px;">
            Por favor ingresa correctamente tu usuario y contraseña.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="color: #a68242; font-size: 14px; letter-spacing: 1px;">Usuario:</label>
            <!-- Control estricto de caracteres y clase CSS -->
            <input type="text" name="username" id="id_username" class="login-input" minlength="3" maxlength="30" required autocomplete="off">
        </div>
        <div style="text-align: left; margin-bottom: 30px;">
            <label style="color: #a68242; font-size: 14px; letter-spacing: 1px;">Contraseña:</label>
            <!-- Control estricto de caracteres y clase CSS -->
            <input type="password" name="password" id="id_password" class="login-input" minlength="4" maxlength="30" required>
        </div>
        <button type="submit" class="login-btn">ENTRAR AL SISTEMA</button>
    </form>
</div>
{% endblock %}
